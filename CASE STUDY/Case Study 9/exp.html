<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Cart Total Calculator</title>
<!-- Your existing CSS styles plus dark mode styles -->
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #1e293b;
    transition: background 0.3s, color 0.3s;
  }
  body.dark-mode {
    background: #121212;
    color: #eee;
  }

  /* Toggle button container */
  .toggle-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
  }

  #themeToggle {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    background: #4f46e5;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }
  #themeToggle:hover {
    background: #4338ca;
  }

  /* Existing styles (adjust as needed for dark mode) */
  .header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 28px 7%;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
  }
  body.dark-mode .header {
    background: linear-gradient(135deg, #222, #444);
  }

  /* Card background in dark mode */
  body.dark-mode .card {
    background-color: #222;
    border: 1px solid #555;
    color: #eee;
  }

  /* Continue with other styles, adding dark mode adjustments if needed */
  /* For example, change button backgrounds, input borders, etc. */

  /* Example for buttons */
  body.dark-mode .add-btn {
    background: #666;
  }
  body.dark-mode .add-btn:hover {
    background: #555;
  }

  body.dark-mode .qty-btn {
    background: #555;
    color: #eee;
  }
  body.dark-mode .qty-btn:hover {
    background: #777;
  }

  body.dark-mode .remove-btn {
    background: #555;
  }
  body.dark-mode .remove-btn:hover {
    background: #999;
  }

  body.dark-mode .discount-section {
    background: #333;
  }

  body.dark-mode .total {
    border-top: 2px solid #555;
  }

  body.dark-mode .checkout {
    background: linear-gradient(135deg, #555, #333);
  }
  body.dark-mode .checkout:hover {
    box-shadow: 0 8px 18px rgba(85,85,85,0.3);
  }

  /* ... add more dark mode styles as needed */

</style>
</head>
<body>

<!-- Dark/Light Toggle Button -->
<div class="toggle-container">
  <button id="themeToggle">Switch to Dark Mode</button>
</div>

<!-- Your existing content (header, main, etc.) -->
<header class="header">
  <h1>🛒 Smart Cart Calculator</h1>
  <p>Array Methods • Object Handling • Discount Logic</p>
</header>

<main class="container">
  <!-- Left Card: Add Product, Cart, Info -->
  <section class="card">
    <!-- ... your existing HTML for add product, cart, info ... -->
  </section>

  <!-- Right Card: Order Summary -->
  <section class="card summary">
    <!-- ... your existing HTML for summary ... -->
  </section>
</main>

<!-- Your existing JavaScript -->
<script>
  // Toggle theme logic
  const themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      themeBtn.innerText = 'Switch to Light Mode';
    } else {
      themeBtn.innerText = 'Switch to Dark Mode';
    }
  });

  // Your existing JS code (functions for cart, render, etc.) go here...
  // (Just keep your current script content as is after this toggle code)
</script>
</body>
</html>
